seed: 13
val_fraction: 0.5

dataset:
  name: abt_buy
  archive_url: https://dbs.uni-leipzig.de/files/datasets/Abt-Buy.zip
  data_dir: data/raw/abt_buy
  left_file: Abt.csv
  right_file: Buy.csv
  mapping_file: abt_buy_perfectMapping.csv
  left_id: id
  right_id: id
  mapping_left_col: idAbt
  mapping_right_col: idBuy
  left_name: name
  right_name: name
  left_text: [name, description]
  right_text: [name, description, manufacturer]
  right_brand: manufacturer
  left_brand: null
  # Synthetic "new product" rows. Every Abt row in Abt-Buy has a true pair, so without this the
  # no_match zone cannot be evaluated. Fraction of rows (per split) whose true Buy items are
  # removed from the catalog. 0.0 = use the dataset as is. Reported as synthetic in results.md.
  new_product_fraction: 0.15

models:
  embedding: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  query_instruction: "Represent this sentence for searching relevant passages: "

retrieval:
  top_k: 20
  per_mode_k: 50
  rrf_k: 60
  qdrant_url: ":memory:"
  collection: catalog

thresholds:
  target_precision: 0.98
  min_auto_support: 20
  wilson_z: 0.0
  llm_min_answerable: 0.5
  min_llm_support: 10
  no_match_target_precision: 0.95
  min_no_match_support: 10

llm:
  provider: recorded        # fake | recorded | openai
  base_url: http://localhost:11434/v1
  model: qwen2.5:14b
  api_key_env: LLM_API_KEY
  cassette_dir: cassettes/eval
  max_concurrency: 2   # local model: more parallel requests only queue up
  timeout_s: 180       # a local model on CPU can take a while per answer
  max_retries: 4
  backoff_base_s: 1.0
  top_candidates: 3
  # prompt_version and min_confidence were chosen on val by `make tune` (rule: widest set of rows
  # resolved at >= target_accuracy on val); see "LLM prompt tuning" in reports/results.md.
  prompt_version: v2
  min_confidence: 0.6
  target_accuracy: 0.90
  min_resolved_support: 10
  # USD per 1M tokens; set for the model you record with.
  price_input_per_1m: 0.0
  price_output_per_1m: 0.0
