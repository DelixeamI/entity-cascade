[project]
name = "entity-cascade"
version = "0.1.0"
description = "Product matching cascade: BM25+dense -> reranker -> LLM arbiter -> human review"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
entity-cascade = "entity_cascade.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_cascade"]

# On Linux (CI) the default torch wheel is the CUDA build (~2 GB); use the CPU index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["slow: loads real HF models (CPU, a few seconds)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF005"]  # list concatenation reads better than unpacking in the report builders

[tool.ruff.lint.per-file-ignores]
# Unicode dashes / full-width forms are the data these files deal with.
"src/entity_cascade/data/normalize.py" = ["RUF001"]
"tests/test_normalize.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "sentence_transformers", "sentence_transformers.*", "matplotlib.*"]
ignore_missing_imports = true
